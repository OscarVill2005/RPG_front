<ion-content [fullscreen]="true">
  <ion-grid class="grid_boss">
    <ion-row>
      <ion-col></ion-col>
      <ion-col> <p class="bosshp" *ngIf="game_started">{{jefe}}</p> <img class="boss_img" src="../../assets/boss.gif"> </ion-col>
      <ion-col> <img class="btn_start" src="../../assets/btn_start.png" *ngIf="!game_started && user_list[0] === info.email" (click)="start()"></ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid class="grid_players">
    <ion-row>
      <ion-col *ngFor="let user of user_list">
        <ion-button class="attack_button" *ngIf="user === info.email" (click)="start_turn(1)"> ATACAR </ion-button>
        <ion-button class="heal_button" *ngIf="user === info.email" (click)="start_turn(2)"> CURAR </ion-button>
        <img src="../../assets/healer.png">
        <p class="playerhp" >{{user}}</p>
        <p *ngIf="user === info.email && game_started">HP: {{hp}}</p>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
